steps:
  # 1. Construir la imagen apuntando al Dockerfile de frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/frontend-react', 
      '-f', './frontend/Dockerfile', 
      './frontend'
    ]

  # 2. Subir la imagen al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend-react']

  # 3. Desplegar en Cloud Run cambiando el puerto a 8080
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'frontend-react-service'
      - '--image=gcr.io/$PROJECT_ID/frontend-react'
      - '--region=us-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080' # 🖥️ Cambiado a 8080 para que coincida con tu Dockerfile

images:
  - 'gcr.io/$PROJECT_ID/frontend-react'